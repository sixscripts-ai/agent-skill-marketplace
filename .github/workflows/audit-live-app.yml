name: Audit live Agent Skill Marketplace

on:
  push:
    branches: [agent/live-review-audit]
    paths:
      - "tests/e2e/live-review.spec.ts"
      - ".github/workflows/audit-live-app.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Exercise production routes and builders
        shell: bash
        env:
          PLAYWRIGHT_BASE_URL: https://agent-skill-marketplace.vercel.app
          AUDIT_USERNAME: Admin
          AUDIT_PASSWORD: Admin
        run: |
          mkdir -p audit
          set +e
          pnpm exec playwright test tests/e2e/live-review.spec.ts --project=chromium-desktop --project=mobile-chrome 2>&1 | tee audit/run.log
          code=${PIPESTATUS[0]}
          echo "$code" > audit/exit-code.txt
          exit 0
      - name: Commit audit evidence
        shell: bash
        run: |
          git add audit test-results playwright-report 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No audit evidence produced"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Record live marketplace audit"
          git push origin HEAD:agent/live-review-audit
