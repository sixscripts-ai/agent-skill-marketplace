name: Apply SkillCheck Studio integration

on:
  push:
    branches: [agent/skillcheck-release-gates-v2]
    paths:
      - ".integration/skillcheck.marker"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Reconstruct verified source overlay
        shell: bash
        run: |
          set -euo pipefail
          cat .integration/skillcheck.chunk-* | base64 --decode > /tmp/skillcheck-overlay.tar.gz
          echo "c0bbeb99d2ae27cc7acf47c63b1db87b198ed59b5d7171ba59247f7838e27046  /tmp/skillcheck-overlay.tar.gz" | sha256sum --check -
          tar -xzf /tmp/skillcheck-overlay.tar.gz -C .
          rm -rf .integration
          rm -f .github/workflows/apply-skillcheck-integration.yml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm exec prisma generate

      - name: Verify SkillCheck integration
        run: pnpm test:skillcheck

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Publish verified implementation
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Integrate SkillCheck release evidence"
          git push origin HEAD:agent/skillcheck-release-gates-v2
